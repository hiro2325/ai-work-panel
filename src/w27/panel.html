<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI作業パネル</title>
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --ink:#1f2a28; --sub:#5b6966; --line:#dfe5e3;
  --main:#1f7a6d; --main-soft:#e3f2ef; --warn:#b76a00; --warn-soft:#fff2dc;
  --ng:#b3261e; --ng-soft:#fde8e6; --ok:#2e7d32; --ok-soft:#e6f4e7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif;font-size:17px;line-height:1.6}
header{background:var(--main);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
header h1{font-size:21px;margin:0;font-weight:700}
.badge-local{margin-left:auto;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 14px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:24px 20px 48px}
.crumb{color:var(--sub);font-size:14px;margin-bottom:10px}
.crumb a{color:var(--main);text-decoration:none}
h2{font-size:22px;margin:4px 0 16px}
.lead{color:var(--sub);margin:-8px 0 20px}
/* トップ */
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:16px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;cursor:pointer}
.step:hover{border-color:var(--main)}
.num{width:44px;height:44px;border-radius:50%;background:var(--main-soft);color:var(--main);
  display:grid;place-items:center;font-weight:700;font-size:20px}
.step b{font-size:19px}
.step .desc{color:var(--sub);font-size:14px}
.cnt{min-width:84px;text-align:center;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;background:#eef1f0;color:var(--sub)}
.cnt.hot{background:var(--main);color:#fff}
.cnt.warn{background:var(--warn);color:#fff}
.group-label{font-size:13px;color:var(--sub);margin:22px 0 8px;letter-spacing:.05em}
.others{display:flex;flex-wrap:wrap;gap:8px}
.others span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--sub)}
/* ボタン */
.btn{display:inline-block;text-decoration:none;border:0;border-radius:10px;padding:12px 26px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--main);color:#fff}
.btn.light{background:var(--card);color:var(--main);border:1.5px solid var(--main)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:8px}
.btn[disabled]{background:#c9d2cf;color:#fff;cursor:not-allowed}
.bar{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:20px}
/* 資料を入れる */
.drop{border:2.5px dashed var(--main);border-radius:16px;background:var(--main-soft);padding:44px 20px;text-align:center}
.drop .big{font-size:21px;font-weight:700;color:var(--main)}
.drop .sm{color:var(--sub);font-size:14px}
.files{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:16px}
.files div{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line)}
.files div:first-child{border-top:0}
.kind{font-size:13px;color:var(--sub)}
.flist-h{font-size:16px;margin:18px 0 0}
.files .fn{overflow-wrap:anywhere;min-width:0}
.files .fr{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.muf{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:var(--card);border-radius:8px;padding:8px 10px;margin-top:8px}
.muf .fn{overflow-wrap:anywhere;min-width:0;font-weight:600}
.muf .us{font-size:14px;overflow-wrap:anywhere;min-width:0}
.muf.bad{outline:2px solid var(--ng)}
/* 確認 */
.file{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.fhead{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.fhead b{font-size:17px}
.st{margin-left:auto;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.hold{background:var(--warn-soft);color:var(--warn)}
.fbody{padding:14px 18px;font-size:15.5px}
.rep{background:var(--ok-soft);color:var(--ok);border-radius:5px;padding:0 4px;font-weight:700}
.rep small{font-weight:400;color:var(--sub)}
.sus{background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:0 4px;font-weight:700;outline:2px solid var(--warn)}
.ask{margin-top:12px;background:var(--warn-soft);border-radius:10px;padding:12px 14px}
.ask .q{font-weight:700;margin-bottom:8px}
.ask .row{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:18px;font-size:14px;color:var(--sub);margin-bottom:14px}
.send .form{grid-template-columns:minmax(120px,max-content) 1fr}
@media (max-width:640px){.send .form{grid-template-columns:1fr}}
.send .form .nw{white-space:nowrap}
.send{background:var(--card);border:2px solid var(--main);border-radius:14px;padding:16px 18px;margin-top:18px}
.send h3{margin:0 0 10px;font-size:18px}
.form{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;align-items:center}
select,input{font-family:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.note{font-size:13px;color:var(--sub)}
/* 合格品 */
.item{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.item .t{font-size:18px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:13px;border-radius:999px;padding:2px 10px;background:#eef1f0;color:var(--sub)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.g{background:var(--ok-soft);color:var(--ok)}
.page{display:none}.page.on{display:block}
@media (max-width:640px){.step{grid-template-columns:44px 1fr}.cnt{grid-column:2}.form{grid-template-columns:1fr}}
.step .desc,.item .files{overflow-wrap:anywhere}
.msg{border-radius:10px;padding:12px 16px;margin:12px 0;font-size:15.5px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.ng{background:var(--ng-soft);color:var(--ng)}
.msg.info{background:var(--main-soft);color:var(--ink)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.75);display:none;place-items:center;z-index:9;font-size:19px;font-weight:700;color:var(--main)}
.busy.on{display:grid}
.spin{width:42px;height:42px;border:5px solid var(--main-soft);border-top-color:var(--main);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.drop.over{background:#cfe9e3}
.others a{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--main);cursor:pointer;text-decoration:none}
.ask input{min-width:220px}
.added{color:var(--ok);font-weight:700}
pre.memo{white-space:pre-wrap;background:#fafbfb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14.5px;max-height:320px;overflow:auto}
.empty{color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.fbody .line{padding:2px 0;border-bottom:1px dotted #eef1f0}
.x{background:none;border:1px solid var(--line);border-radius:8px;color:var(--ng);cursor:pointer;font-family:inherit;font-size:14px;padding:3px 10px}
.x:hover{border-color:var(--ng)}
details.reg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:16px}
details.reg summary{cursor:pointer;font-weight:700;color:var(--main)}
.warnbox{background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px}
.copyline{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:17px;font-weight:700}
/* そのほかのページ */
.others a{display:inline-block}
.top-back{display:inline-block;color:var(--main);text-decoration:none;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:18px}
.tw{overflow-x:auto;max-width:100%}
table.nt{border-collapse:collapse;width:100%;background:var(--card);font-size:15.5px}
table.nt th,table.nt td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
table.nt th{background:#eef1f0;font-size:14px;color:var(--sub);font-weight:700}
table.nt td.ops{white-space:nowrap;text-align:right}
table.nt td.code{font-family:Consolas,monospace;font-size:14px;color:var(--main)}
.hit-none{color:var(--sub);padding:12px}
.search{width:100%;margin-bottom:10px}
.editbox{border:2px solid var(--main);background:var(--main-soft)}
.secondary{border-top:1px dashed var(--line);margin-top:24px;padding-top:12px}
.secondary .note{margin-bottom:6px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;overflow-wrap:anywhere}
.doc h1{font-size:21px;margin:14px 0 8px}.doc h2{font-size:19px;margin:16px 0 8px;border-left:4px solid var(--main);padding-left:8px}.doc h3,.doc h4{font-size:17px;margin:14px 0 6px}
.doc p{margin:6px 0}.doc ul,.doc ol{margin:6px 0;padding-left:1.4em}
.doc table{border-collapse:collapse;margin:8px 0;font-size:15px}
.doc th,.doc td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.doc th{background:#eef1f0}
.doc pre{white-space:pre-wrap;background:#fafbfb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.doc code{background:#eef1f0;border-radius:4px;padding:0 4px;font-size:.92em}
.doc .box,.doc .warn{background:#f4f6f8;border-radius:8px;padding:8px 12px;margin:8px 0}
.doc .warn{background:var(--warn-soft)}
.chip.n{background:var(--warn-soft);color:var(--warn)}
textarea{font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;width:100%;min-height:260px;resize:vertical;background:#fff}
.pendbar{position:sticky;top:0;z-index:5;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#pendbar-bottom{position:static}
.pendbar .pendnote{flex:1 1 240px;margin:0}
.staffbox{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
.staffbox .staffrow{display:block;padding:4px 0;border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
.howbox{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent,#c77);border-radius:10px;padding:10px 14px;margin:10px 0;line-height:1.7}
.howbox .howname{font-weight:700;margin-top:4px}
.ask.known{opacity:.75}
.kaizen{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 18px 14px;margin-top:18px}
.kaizen textarea{min-height:80px}
.paste{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:18px}
.samples{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px 18px;margin-top:14px}
.samples h3{margin:0 0 8px;font-size:16px}
.sample-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--main-soft)}
.sample-card[draggable=true]{cursor:grab}
.sample-card .fn{overflow-wrap:anywhere;min-width:0}
.paste h3{margin:0 0 8px;font-size:18px}
.dirs .card summary{cursor:pointer}
.orig-warn{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px}
@media (max-width:640px){
  header{padding:12px 16px}
  main{padding:18px 12px 40px}
  table.nt thead{display:none}
  table.nt,table.nt tbody,table.nt tr,table.nt td{display:block;width:100%}
  table.nt tr{border-bottom:2px solid var(--line);padding:6px 0}
  table.nt td{border:0;padding:3px 10px}
  table.nt td[data-l]::before{content:attr(data-l)"：";color:var(--sub);font-size:13px}
  table.nt td.ops{text-align:left;white-space:normal}
  .bar{flex-wrap:wrap}
  .item{grid-template-columns:1fr}
  .ask input{min-width:0;width:100%}
  .fhead{flex-wrap:wrap}
}
.opwrap{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px}
.opnote{font-size:12px;color:var(--sub);white-space:normal}
.titlerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.titlerow input{flex:1 1 220px;min-width:0}
.voicebtn{white-space:nowrap}
.hint{font-size:13px;color:var(--sub);margin-top:4px}
.titlewarn{font-size:13.5px;color:var(--warn);margin-top:4px;font-weight:700}
@media (max-width:640px){.opwrap{align-items:flex-start}}
.when{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--sub);margin-top:4px}
.when b{color:var(--ink);font-weight:700}
.donelist>div{align-items:center;gap:10px}
.donelist .dn{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.donelist .btn{white-space:nowrap;flex-shrink:0}
/* 片づける */
.btn.danger{background:var(--ng);color:#fff}
.jobops{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.job .files{margin-top:8px}
.clist{margin:6px 0 0;padding-left:1.2em}
.clist li{overflow-wrap:anywhere;margin:3px 0}
.clist details summary{cursor:pointer;color:var(--sub);font-size:14px}
.clist .inner{font-size:13.5px;color:var(--sub);margin:4px 0 0;padding-left:1.2em}
.cgroup h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:700}
.skipbox summary{cursor:pointer;font-weight:700;color:var(--warn)}
.skipbox .sk{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;overflow-wrap:anywhere}
.msg{white-space:pre-line;overflow-wrap:anywhere}
@media (max-width:640px){.jobops{align-items:stretch}.cleanbar{flex-direction:column-reverse;align-items:stretch}.cleanbar .btn{width:100%}}
/* 支援経過（改善4） */
.paste.keika{border:2px solid var(--main)}
.kbadge{display:inline-block;font-size:12px;background:var(--main-soft);color:var(--main);border-radius:999px;padding:1px 10px;margin-left:6px;vertical-align:middle}
.kprev{white-space:pre-wrap;background:#fafbfb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px;overflow-wrap:anywhere;margin:6px 0 0}
.kfiles div{overflow-wrap:anywhere}
.donelist .kact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
input[type=date]{min-width:0}
/* 日付の欄と小さなカレンダー（改善5） */
.datebox{position:relative;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%}
.datebox input.dtext{width:9.5em;min-width:0}
.datebox .calbtn{padding:6px 10px;line-height:1.2}
.datebox .dlabel{font-size:13.5px;color:var(--sub)}
.calpop{position:absolute;top:calc(100% + 4px);left:0;z-index:30;width:260px;max-width:calc(100vw - 32px);box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:8px}
.calpop[hidden]{display:none}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;font-weight:700}
.calhead button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 10px;cursor:pointer;font-size:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calgrid .wd{font-size:12px;color:var(--sub)}
.calgrid .wd.sun,.calgrid button.sun{color:#c0392b}.calgrid .wd.sat,.calgrid button.sat{color:#1f5fa8}
.calgrid button{border:0;background:none;border-radius:6px;padding:5px 0;cursor:pointer;font-size:14px;min-width:0}
.calgrid button:hover,.calgrid button:focus{background:var(--main-soft);outline:none}
.calgrid button.today{box-shadow:inset 0 0 0 1px var(--main)}
.calgrid button.sel{background:var(--main);color:#fff}
.calgrid button:disabled{color:#bbb;cursor:default;background:none}
.calfoot{display:flex;justify-content:space-between;margin-top:6px;gap:6px}
.dupmark{display:inline-block;font-size:12px;background:var(--warn-soft,#fff3cd);color:var(--warn);border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:700}
tr.duprow td{background:#fffaf0}
/* 氏名一覧：マウスを乗せた行・直している行に色（改善24） */
table.nt tbody tr[data-row]:hover td{background:color-mix(in srgb,var(--main-soft) 50%,#fff)}
table.nt tbody tr.editing td,table.nt tbody tr.editing:hover td{background:var(--main-soft)}
table.nt tbody tr.editing{outline:2px solid var(--main);outline-offset:-2px}
.namebar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 6px;box-shadow:0 6px 6px -6px rgba(0,0,0,.12)}
.namebar .note{margin:0;background:var(--bg)}
.kindchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.kindchips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.kindchips button:hover{border-color:var(--main)}
.kindchips button.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
#dupbox .duprows{max-height:340px;overflow:auto;border:1px solid var(--line,#ddd);border-radius:8px;padding:6px 10px;background:#fff;margin:8px 0}
#dupbox label.dg{display:block;padding:6px 0;border-bottom:1px dashed #eee}
#dupbox label.dg:last-child{border-bottom:none}
#dupbox .dgn{font-weight:700}
#dupbox .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(92vw,720px);z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.18);margin:0}
tr.editrow>td{background:var(--main-soft)}
tr.editrow .editbox{margin:4px 0}
@media (max-width:640px){.donelist>div{flex-wrap:wrap}.donelist .kact{justify-content:flex-start;width:100%}.donelist .kact .btn{white-space:normal}}
/* 組織図（改善7） */
.org{display:grid;justify-items:center;gap:0}
.onode{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 18px;min-width:260px;max-width:520px;width:100%;text-align:center}
.onode.boss{border-color:var(--main);background:var(--main-soft)}
.onode .on{font-size:19px;font-weight:700}
.onode .or{font-size:13px;color:var(--sub)}
.vline{width:2px;height:22px;background:var(--main);opacity:.5}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-items:start;width:100%;border-top:2px solid rgba(31,122,109,.5);padding-top:16px;margin-top:0}
.ocard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ocard.s-work{border-color:var(--main)}
.ocard.s-wait{border-color:var(--warn)}
.ocard.s-consult{border-color:var(--ng)}
.ocard .oh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ocard .oh b{font-size:17px}
.ostate{margin-left:auto;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:#eef1f0;color:var(--sub);white-space:nowrap}
.ostate.work{background:var(--main);color:#fff}
.ostate.wait{background:var(--warn);color:#fff}
.ostate.consult{background:var(--ng);color:#fff}
.ostate.prep{background:#fff;border:1px dashed var(--sub)}
.orow{font-size:14px;overflow-wrap:anywhere}
.orow .k{color:var(--sub);font-size:12.5px;display:block}
.ogroup{grid-column:1/-1;border:1.5px dashed rgba(31,122,109,.5);border-radius:16px;padding:10px 12px 12px}
.ogroup>.gl{font-weight:700;color:var(--main);margin:0 0 8px 4px}
.ogroup .ogrid{border-top:0;padding-top:0}
.oitems{list-style:none;margin:4px 0 0;padding:0;font-size:13.5px}
.oitems li{padding:4px 0;border-top:1px dotted var(--line);overflow-wrap:anywhere}
.oitems li .d{color:var(--sub);font-size:12px}
